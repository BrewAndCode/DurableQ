<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="700" viewBox="0 0 1240 700" role="img" aria-labelledby="title desc">
<title id="title">DurableQ worker throughput and latency</title>
<desc id="desc">Median completed jobs per second and median per-run p50, p95, and p99 completion latency by worker thread count.</desc>
